<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>colour picker (if)</title>
    <link rel="stylesheet" href="colours.css">
    <script src="colour-if-script.js" defer></script>
</head>
<body>
    <h1>if statement!!!1!</h1>

    <label for="colour">PLEASE choose a colour PLEASE PLEASE PLEASE</label><br>
    <select id="colour">
        <option value="">-- chose --</option>
        <option value="red">red >:(</option>
        <option value="blue">blue :(</option>
        <option value="green">green :)</option>
        <option value="yellow">yellow :D</option>
        <option value="pink">pink :3</option>
        <option value="purple">ourple :/</option>
    </select><br>
    
    <p id="display">sample text</p>
</body>
</html>
