<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>js arithmetic</title>

    <style>
        body  { font-family: Arial, sans-serif; }
        input { width: 60px; margin: 5px; }
    </style>
    <script src="calculate-script.js" defer></script>
</head>
<body>
    <h1>calculator!!</h1>

    <label for="number1">number 1:</label>
    <input type="number" id="number1" value="0"><br>

    <label for="number2">number 2:</label>
    <input type="number" id="number2" value="0"><br>

    <button type="button" id="btnAdd">+</button>
    <button type="button" id="btnSub">-</button>
    <button type="button" id="btnMul">x</button>
    <button type="button" id="btnDiv">/</button>
    <button type="button" id="btnMod">%</button>
    <br>
    <button type="button" id="btnClear">reset</button>

    <p id="display"></p>
</body>
</html>
